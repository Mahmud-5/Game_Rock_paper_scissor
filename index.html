<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Game - R P S</title>
  </head>
  <body class="bd">
    <h1>ROCK PAPER SCISSOR</h1>
    <div class="choices">
      <div class="choice" id="rock">
        <img src="rock.svg" alt="" />
      </div>
      <div class="choice" id="paper">
        <img src="paper.svg" alt="" />
      </div>
      <div class="choice" id="scissor">
        <img src="scissor.svg" alt="" />
      </div>
    </div>

    <div class="score-board">
      <div class="score">
        <p id="user-score">0</p>
        <p>User</p>
      </div>
      <div class="score">
        <p id="com-score">0</p>
        <p>Com</p>
      </div>
    </div>
    <div class="commsg">
      <p id="com_msg">Computer guessing</p>
    </div>
    <div class="msg-container">
      <p id="msg">Play your move if you dare 🤨</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
